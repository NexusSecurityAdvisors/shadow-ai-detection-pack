# Gitleaks rules for AI provider API keys.
# Merge into your .gitleaks.toml ([extend] useDefault = true keeps the built-in rules).
# Recent Gitleaks releases already cover some of these; keep whichever is more current.

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\bsk-ant-(?:api03|admin01)-[A-Za-z0-9_\-]{80,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API key (project, service account, admin, legacy)"
regex = '''\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_\-]{40,}|\bsk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}\b'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-", "T3BlbkFJ"]

[[rules]]
id = "google-ai-api-key"
description = "Google API key (used for Gemini / Generative Language API)"
regex = '''\bAIza[0-9A-Za-z_\-]{35}\b'''
keywords = ["AIza"]

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{48,}\b'''
keywords = ["gsk_"]

[[rules]]
id = "huggingface-token"
description = "Hugging Face access token"
regex = '''\bhf_[A-Za-z0-9]{30,}\b'''
keywords = ["hf_"]

[[rules]]
id = "xai-api-key"
description = "xAI API key"
regex = '''\bxai-[A-Za-z0-9]{70,}\b'''
keywords = ["xai-"]

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[a-f0-9]{64}\b'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "ai-key-env-assignment"
description = "AI provider key assigned in config or env file (catches formats the rules above miss)"
regex = '''(?i)\b(?:OPENAI|ANTHROPIC|GEMINI|GOOGLE_AI|MISTRAL|DEEPSEEK|GROQ|TOGETHER|OPENROUTER|COHERE|XAI|PERPLEXITY)_API_KEY\s*[:=]\s*["']?[A-Za-z0-9_\-]{20,}'''
keywords = ["_API_KEY"]
